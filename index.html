<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#0f172a">

<title>TBC ADS</title>


<!-- Telegram Web App -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>


<!-- Monetag SDK -->
<script
    src="https://libtl.com/sdk.js"
    data-zone="11626066"
    data-sdk="show_11626066">
</script>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    background:
        linear-gradient(
            145deg,
            #020617,
            #0f172a
        );

    color:#ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}


.container{

    width:100%;

    max-width:390px;

}


.card{

    width:100%;

    background:
        rgba(30,41,59,.96);

    border:
        1px solid
        rgba(255,255,255,.06);

    border-radius:25px;

    padding:30px 22px;

    text-align:center;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.45);

}


.logo{

    width:76px;

    height:76px;

    margin:
        0 auto 18px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #16a34a
        );

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:38px;

    box-shadow:
        0 10px 30px
        rgba(34,197,94,.25);

}


.title{

    font-size:27px;

    font-weight:700;

    margin-bottom:8px;

}


.description{

    color:#94a3b8;

    font-size:14px;

    line-height:1.6;

    margin-bottom:22px;

}


.user-box{

    background:#0f172a;

    border-radius:14px;

    padding:13px;

    margin-bottom:18px;

    color:#94a3b8;

    font-size:13px;

    word-break:break-all;

}


.user-id{

    color:#ffffff;

    font-weight:bold;

}


.watch-button{

    width:100%;

    padding:17px 15px;

    border:0;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #16a34a
        );

    color:#ffffff;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 10px 25px
        rgba(34,197,94,.20);

    transition:
        transform .15s,
        opacity .15s;

}


.watch-button:active{

    transform:scale(.97);

}


.watch-button:disabled{

    opacity:.55;

    cursor:not-allowed;

    transform:none;

}


.status{

    min-height:24px;

    margin-top:18px;

    color:#cbd5e1;

    font-size:14px;

    line-height:1.5;

}


.footer{

    margin-top:20px;

    color:#64748b;

    font-size:11px;

}


</style>

</head>


<body>


<div class="container">

    <div class="card">


        <div class="logo">

            🎁

        </div>


        <div class="title">

            TBC ADS

        </div>


        <div class="description">

            Watch a rewarded advertisement
            and complete the required viewing
            to receive your reward.

        </div>


        <div class="user-box">

            Telegram ID:

            <span
                id="userId"
                class="user-id">

                Loading...

            </span>

        </div>


        <button
            id="watchBtn"
            class="watch-button"
            onclick="watchAd()">

            ▶ WATCH ADS

        </button>


        <div
            id="status"
            class="status">

            Ready

        </div>


        <div class="footer">

            Powered by TBC ADS

        </div>


    </div>

</div>



<script>

/*
==================================================
TELEGRAM MINI APP
==================================================
*/

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


if (tg) {

    tg.ready();

    tg.expand();

}



/*
==================================================
GET TELEGRAM USER
==================================================
*/

function getTelegramUser() {

    if (!tg) {

        return null;

    }


    if (
        !tg.initDataUnsafe ||
        !tg.initDataUnsafe.user
    ) {

        return null;

    }


    return tg.initDataUnsafe.user;

}



/*
==================================================
SHOW USER ID
==================================================
*/

function updateUserId() {

    const element =
        document.getElementById("userId");


    const user =
        getTelegramUser();


    if (user && user.id) {

        element.textContent =
            String(user.id);

    } else {

        element.textContent =
            "Not available";

    }

}


updateUserId();



/*
==================================================
STATUS
==================================================
*/

function setStatus(text) {

    document.getElementById(
        "status"
    ).textContent = text;

}



/*
==================================================
BUTTON
==================================================
*/

function setButtonDisabled(value) {

    document.getElementById(
        "watchBtn"
    ).disabled = value;

}



/*
==================================================
SEND BROWSER EVENT TO VERCEL
==================================================

IMPORTANT:

This request DOES NOT give the user
the +0.2 reward.

It only tells Vercel that the
browser-side ad flow completed.

The actual reward must come from
Monetag Postback.
==================================================
*/

async function notifyVercel() {

    const user =
        getTelegramUser();


    if (!user) {

        setStatus(
            "❌ Telegram user not found"
        );

        return false;

    }


    if (!tg || !tg.initData) {

        setStatus(
            "❌ Telegram verification data missing"
        );

        return false;

    }


    try {

        const response =
            await fetch(
                "/api/reward",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        user_id:
                            String(user.id),

                        init_data:
                            tg.initData,

                        reward_event:
                            "ad_completed"

                    })

                }
            );


        const result =
            await response.json();


        console.log(
            "Vercel response:",
            result
        );


        /*
        ==========================================
        POST REQUEST NEVER REWARDS THE USER
        ==========================================
        */

        if (
            result &&
            result.waiting
        ) {

            setStatus(
                "⏳ Ad completed. Waiting for verification..."
            );

            return true;

        }


        if (
            result &&
            result.verified
        ) {

            setStatus(
                "✅ Reward verified!"
            );

            return true;

        }


        setStatus(
            "⏳ Waiting for ad verification..."
        );

        return true;


    } catch (error) {

        console.error(
            "Vercel request error:",
            error
        );


        setStatus(
            "⏳ Ad completed. Waiting for verification..."
        );


        /*
        Do NOT show reward failure here.
        Monetag Postback may arrive separately.
        */

        return false;

    }

}



/*
==================================================
MONETAG REWARDED INTERSTITIAL
==================================================
*/

async function watchAd() {


    const user =
        getTelegramUser();


    /*
    ==========================================
    TELEGRAM CHECK
    ==========================================
    */

    if (!user) {

        setStatus(
            "❌ Please open this app from Telegram."
        );

        return;

    }


    /*
    ==========================================
    DISABLE BUTTON
    ==========================================
    */

    setButtonDisabled(true);


    setStatus(
        "⏳ Loading advertisement..."
    );


    try {


        /*
        ==========================================
        CHECK MONETAG SDK
        ==========================================
        */

        if (
            typeof show_11626066 !==
            "function"
        ) {

            throw new Error(
                "Monetag SDK is not ready"
            );

        }


        /*
        ==========================================
        SHOW REWARDED INTERSTITIAL
        ==========================================
        */

        await show_11626066();


        /*
        ==========================================
        AD COMPLETED

        IMPORTANT:
        No +0.2 here.

        We only notify Vercel.
        ==========================================
        */

        setStatus(
            "✅ Ad completed. Verifying reward..."
        );


        await notifyVercel();


    } catch (error) {


        console.error(
            "Monetag error:",
            error
        );


        /*
        ==========================================
        AD WAS NOT COMPLETED
        ==========================================
        */

        setStatus(
            "❌ Ad not completed. Please watch again."
        );

    }


    /*
    ==========================================
    ENABLE BUTTON AGAIN
    ==========================================
    */

    setButtonDisabled(false);

}



/*
==================================================
TELEGRAM THEME
==================================================
*/

if (tg) {

    try {

        tg.onEvent(
            "themeChanged",
            function() {

                console.log(
                    "Telegram theme changed"
                );

            }
        );

    } catch (e) {

        console.log(
            "Theme event unavailable"
        );

    }

}

</script>


</body>

</html>
