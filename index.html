<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#0f172a">

<title>TBC ADS</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script
    src="https://libtl.com/sdk.js"
    data-zone="11626066"
    data-sdk="show_11626066">
</script><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        linear-gradient(
            145deg,
            #020617,
            #0f172a
        );
    color:#ffffff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:390px;
}

.card{
    width:100%;
    background:rgba(30,41,59,.96);
    border:1px solid rgba(255,255,255,.06);
    border-radius:25px;
    padding:30px 22px;
    text-align:center;
    box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.logo{
    width:76px;
    height:76px;
    margin:0 auto 18px;
    border-radius:22px;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
}

.title{
    font-size:27px;
    font-weight:700;
    margin-bottom:8px;
}

.description{
    color:#94a3b8;
    font-size:14px;
    line-height:1.6;
    margin-bottom:22px;
}

.user-box{
    background:#0f172a;
    border-radius:14px;
    padding:13px;
    margin-bottom:18px;
    color:#94a3b8;
    font-size:13px;
    word-break:break-all;
}

.user-id{
    color:#ffffff;
    font-weight:bold;
}

.watch-button,
.done-button{
    width:100%;
    padding:17px 15px;
    border:0;
    border-radius:15px;
    color:#ffffff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.watch-button{
    background:linear-gradient(135deg,#22c55e,#16a34a);
    box-shadow:0 10px 25px rgba(34,197,94,.20);
}

.done-button{
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    box-shadow:0 10px 25px rgba(59,130,246,.20);
}

.watch-button:active,
.done-button:active{
    transform:scale(.97);
}

.watch-button:disabled,
.done-button:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}

.done-button{
    display:none;
}

.timer{
    display:none;
    margin-top:16px;
    color:#f8fafc;
    font-size:18px;
    font-weight:bold;
}

.status{
    min-height:24px;
    margin-top:18px;
    color:#cbd5e1;
    font-size:14px;
    line-height:1.5;
}

.footer{
    margin-top:20px;
    color:#64748b;
    font-size:11px;
}

</style></head><body><div class="container"><div class="card"><div class="logo">
🎁
</div><div class="title">
TBC ADS
</div><div class="description">
Watch the advertisement and wait
until the timer is complete.
</div><div class="user-box">Telegram ID:

<span
id="userId"
class="user-id">

Loading...

</span></div><button
id="watchBtn"
class="watch-button"
onclick="watchAd()">

▶ WATCH ADS

</button><div
    id="timer"
    class="timer">⏳ Please wait:
<span id="seconds">15</span>s

</div><button
id="doneBtn"
class="done-button"
onclick="doneAd()">

✅ DONE

</button><div
    id="status"
    class="status">Ready

</div><div class="footer">
Powered by TBC ADS
</div></div></div><script>

/*
==================================================
TELEGRAM
==================================================
*/

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

if (tg) {
    tg.ready();
    tg.expand();
}


/*
==================================================
USER
==================================================
*/

function getTelegramUser(){

    if(!tg){
        return null;
    }

    if(
        !tg.initDataUnsafe ||
        !tg.initDataUnsafe.user
    ){
        return null;
    }

    return tg.initDataUnsafe.user;
}


function updateUserId(){

    const user =
        getTelegramUser();

    const element =
        document.getElementById("userId");

    if(user && user.id){

        element.textContent =
            String(user.id);

    }else{

        element.textContent =
            "Not available";

    }

}

updateUserId();


/*
==================================================
UI
==================================================
*/

function setStatus(text){

    document.getElementById(
        "status"
    ).textContent = text;

}


function setWatchDisabled(value){

    document.getElementById(
        "watchBtn"
    ).disabled = value;

}


function setDoneVisible(value){

    document.getElementById(
        "doneBtn"
    ).style.display =
        value ? "block" : "none";

}


function setTimerVisible(value){

    document.getElementById(
        "timer"
    ).style.display =
        value ? "block" : "none";

}


/*
==================================================
SESSION DATA
==================================================
*/

let adStartedAt = 0;

let timerInterval = null;

let adYmid = null;


/*
==================================================
CREATE UNIQUE YMID
==================================================
*/

function createYmid(userId){

    return (
        String(userId) +
        "_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2,10)
    );

}


/*
==================================================
WATCH AD
==================================================
*/

async function watchAd(){

    const user =
        getTelegramUser();

    if(!user){

        setStatus(
            "❌ Please open this app from Telegram."
        );

        return;

    }


    setWatchDisabled(true);

    setDoneVisible(false);

    setTimerVisible(false);

    setStatus(
        "⏳ Loading advertisement..."
    );


    adYmid =
        createYmid(user.id);

    adStartedAt =
        Date.now();


    try{

        if(
            typeof show_11626066 !==
            "function"
        ){

            throw new Error(
                "Monetag SDK is not ready"
            );

        }


        /*
        ==========================================
        MONETAG AD
        ==========================================
        */

        await show_11626066({

            type:"end",

            ymid:adYmid,

            requestVar:"watch_ads"

        });


        /*
        ==========================================
        START 15 SECOND TIMER
        ==========================================
        */

        startTimer();


    }catch(error){

        console.error(
            "Monetag error:",
            error
        );

        resetAd();

        setStatus(
            "❌ Ad not completed. Please watch again."
        );

    }

}


/*
==================================================
15 SECOND TIMER
==================================================
*/

function startTimer(){

    clearInterval(timerInterval);

    setTimerVisible(true);

    setDoneVisible(false);

    setStatus(
        "⏳ Please wait until 15 seconds..."
    );


    function update(){

        const elapsed =
            (Date.now() - adStartedAt) / 1000;

        const remaining =
            Math.max(
                0,
                Math.ceil(15 - elapsed)
            );


        document.getElementById(
            "seconds"
        ).textContent =
            remaining;


        if(remaining <= 0){

            clearInterval(
                timerInterval
            );

            document.getElementById(
                "seconds"
            ).textContent =
                "0";

            setDoneVisible(true);

            setStatus(
                "✅ You can press DONE now."
            );

        }

    }


    update();

    timerInterval =
        setInterval(
            update,
            250
        );

}


/*
==================================================
DONE
==================================================
*/

async function doneAd(){

    const user =
        getTelegramUser();

    if(!user){

        setStatus(
            "❌ Telegram user not found."
        );

        return;

    }


    const elapsed =
        (Date.now() - adStartedAt) / 1000;


    /*
    ==========================================
    LESS THAN 15 SECONDS
    ==========================================
    */

    if(elapsed < 15){

        setStatus(
            "❌ You have not finished the full ad."
        );

        /*
        Send message to bot.
        */

        try{

            if(tg && tg.initData){

                await fetch(
                    "/api/ad-status",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            telegram_id:
                                String(user.id),

                            status:
                                "not_finished",

                            elapsed:
                                elapsed

                        })
                    }
                );

            }

        }catch(e){

            console.log(e);

        }

        resetAd();

        return;

    }


    /*
    ==========================================
    MORE THAN 25 SECONDS
    ==========================================
    */

    if(elapsed > 25){

        setStatus(
            "❌ Time expired. Reward not counted."
        );

        try{

            if(tg && tg.initData){

                await fetch(
                    "/api/ad-status",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            telegram_id:
                                String(user.id),

                            status:
                                "expired",

                            elapsed:
                                elapsed

                        })
                    }
                );

            }

        }catch(e){

            console.log(e);

        }

        resetAd();

        return;

    }


    /*
    ==========================================
    15–25 SECONDS
    ==========================================
    */

    setDoneVisible(false);

    setTimerVisible(false);

    setStatus(
        "⏳ Ad completed. Waiting for verification..."
    );


    /*
    IMPORTANT:

    This does NOT directly add money.

    Monetag valued postback must still
    reach Vercel/TBC.
    */

    try{

        await fetch(
            "/api/reward",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    telegram_id:
                        String(user.id),

                    ymid:
                        String(adYmid || ""),

                    init_data:
                        tg
                            ? tg.initData
                            : "",

                    reward_event:
                        "ad_completed",

                    elapsed:
                        elapsed

                })
            }
        );

    }catch(e){

        console.log(
            "Verification request failed:",
            e
        );

    }

    setStatus(
        "⏳ Ad completed. Waiting for verification..."
    );

    resetAd();

}


/*
==================================================
RESET
==================================================
*/

function resetAd(){

    clearInterval(
        timerInterval
    );

    timerInterval = null;

    adStartedAt = 0;

    adYmid = null;

    setTimerVisible(false);

    setDoneVisible(false);

    setWatchDisabled(false);

}


/*
==================================================
TELEGRAM THEME
==================================================
*/

if(tg){

    try{

        tg.onEvent(
            "themeChanged",
            function(){

                console.log(
                    "Telegram theme changed"
                );

            }
        );

    }catch(e){

        console.log(
            "Theme event unavailable"
        );

    }

}

</script></body></html>
